<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f4f4f9;
      color: #000;
      text-align: center;
      overflow-x: hidden;
    }

    /* === HEADER === */
    header {
      background: linear-gradient(to right, #0d1b4c, #6a1b9a);
      color: white;
      padding: 20px;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    nav ul li {
      display: inline;
      margin: 0 15px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    /* === SECTION === */
    section {
      position: relative;
      padding: 100px 20px;
      background-color: white;
      z-index: 2;
    }

    section h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #0d1b4c;
      position: relative;
      z-index: 5;
    }

    section p {
      font-size: 1.1rem;
      margin-bottom: 30px;
      color: #6a1b9a;
      position: relative;
      z-index: 5;
    }

    /* === BUTTON FIXED === */
    .contact-button {
      display: inline-block;
      background: linear-gradient(to right, #0d1b4c, #6a1b9a);
      color: white;
      padding: 15px 30px;
      font-size: 1.2rem;
      border-radius: 8px;
      text-decoration: none;
      transition: transform 0.3s;
      position: relative;
      z-index: 10;
    }

    .contact-button:hover {
      transform: scale(1.05);
    }

    /* === FLOATING CIRCLES === */
    .floating-shapes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none; /* THIS FIXES THE BUTTON */
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(to right, #0d1b4c, #6a1b9a);
      opacity: 0.3;
      animation: float 12s infinite ease-in-out;
    }

    .shape:nth-child(1) {
      width: 120px;
      height: 120px;
      top: 10%;
      left: 15%;
      animation-delay: 0s;
    }

    .shape:nth-child(2) {
      width: 200px;
      height: 200px;
      bottom: 20%;
      right: 10%;
      animation-delay: 3s;
    }

    .shape:nth-child(3) {
      width: 150px;
      height: 150px;
      top: 60%;
      left: 60%;
      animation-delay: 5s;
    }

    @keyframes float {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-25px); opacity: 0.5; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }

    /* === FOOTER === */
    footer {
      background: linear-gradient(to right, #0d1b4c, #6a1b9a);
      color: white;
      padding: 20px;
      margin-top: auto;
      z-index: 2;
    }

    /* === MOBILE === */
    @media (max-width: 768px) {
      nav ul li {
        display: block;
        margin: 10px 0;
      }

      section {
        padding: 80px 20px;
      }

      .contact-button {
        width: 80%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Contact Me</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="personalProjects.html">Projects</a></li>
        <li><a href="services.html">My Services</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section>
    <div class="floating-shapes">
      <div class="shape"></div>
      <div class="shape"></div>
      <div class="shape"></div>
    </div>

    <h2>Let's Connect</h2>
    <p>Click the button below to fill out my contact form!</p>
    <a class="contact-button" href="https://forms.gle/8pzZpRLHNfUP8mc7A" target="_blank">Contact Me</a>
  </section>

  <footer>
    <p>&copy; 2025 Jordan Lewis</p>
  </footer>
</body>
</html>
