<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <style>
    html, body { margin:0; padding:0; height:100%; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-color: #f4f4f9;
      color: #000;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }

    body.dark { background-color: #1c1c1c; color: #f4f4f9; }

    header {
      background-color: #4169E1;
      color: white;
      padding: 20px;
    }
    body.dark header { background-color: #000; color: #f4f4f9; }

    nav ul { list-style: none; padding: 0; margin: 0; }
    nav ul li { display: inline; margin: 0 15px; }
    nav ul li a { color: white; text-decoration: none; font-weight: bold; }
    body.dark nav ul li a { color: #f4f4f9; }

    section { padding: 50px; }

    .contact-button {
      display: inline-block;
      background-color: #4169E1;
      color: white;
      padding: 15px 30px;
      font-size: 1.2rem;
      border-radius: 8px;
      text-decoration: none;
      margin-top: 30px;
      transition: background-color 0.3s;
    }
    .contact-button:hover { background-color: #27408B; }
    body.dark .contact-button { background-color: #333; }
    body.dark .contact-button:hover { background-color: #555; }

    footer {
      background-color: #4169E1;
      color: white;
      padding: 20px;
      margin-top: auto;
    }
    body.dark footer { background-color: #000; color: #f4f4f9; }

    /* Dark mode toggle button */
    .toggle-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      z-index: 2000; /* keeps it above header */
    }
  </style>
</head>
<body>
  <header>
    <h1>Contact Me</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="personalProjects.html">Personal Projects</a></li>
        <li><a href="services.html">My Services</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Dark Mode Button -->
  <button class="toggle-btn" onclick="toggleDarkMode()">Dark Mode</button>

  <section>
    <h2>Get in Touch</h2>
    <p>Click the button below to fill out my contact form!</p>
    <a class="contact-button" href="https://docs.google.com/forms/d/e/YOUR_FORM_ID/viewform" target="_blank">Contact Me</a>
  </section>

  <footer>
    <p>&copy; 2024 Jordan. All rights reserved.</p>
  </footer>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }
  </script>
</body>
</html>
