<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jordan Lewis - Portfolio</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    scroll-behavior: smooth;
    color: #000;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* LOGO FIXED TOP LEFT */
  .logo-fixed {
    position: fixed;
    top: 15px;
    left: 15px;
    height: 100px; 
    width: auto;
    z-index: 1000; 
    position: fixed;
  }

  /* HEADER */
  header {
    padding: 20px;
    text-align: center;
    background: linear-gradient(to right, #0d1b4c, #6a1b9a);
    color: white;
  }
  header h1 { margin: 0 0 20px 0; }

  nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    text-align: center;
  }
  nav ul li {
    display: inline;
    margin: 0 15px;
  }
  nav ul li a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.3s;
  }
  nav ul li a:hover { text-decoration: underline; }

  /* HERO SECTION */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 60px 20px;
    background: white;
    position: relative;
    overflow: hidden;
  }

  .hero h1 { font-size: 2.5rem; margin-bottom: 20px; color: #0d1b4c; }
  .hero p { 
    font-size: 1.2rem; 
    margin-bottom: 30px; 
    font-weight: bold; 
    color: #6a1b9a; 
    white-space: pre; 
  }

  .hero a {
    display: inline-block;
    margin: 10px;
    padding: 12px 24px;
    background: linear-gradient(to right, #0d1b4c, #6a1b9a);
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    transition: transform 0.3s, background 0.3s;
  }
  .hero a:hover {
    transform: scale(1.05);
    background: linear-gradient(to right, #6a1b9a, #0d1b4c);
  }

  /* Shapes */
  .shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.3;
    animation: float 15s linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-20px) translateX(20px); }
    100% { transform: translateY(0) translateX(0); }
  }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 20px;
    background: linear-gradient(to right, #0d1b4c, #6a1b9a);
    color: white;
    margin-top: auto;
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    nav ul li { display: block; margin: 10px 0; }
    .hero h1 { font-size: 2rem; }
    .hero p { font-size: 1rem; }
    .hero a { display: block; width: 80%; margin: 10px auto; }
  }
  @media (max-width: 480px) {
    .hero h1 { font-size: 1.6rem; }
    .hero p { font-size: 0.9rem; }
    .hero a { font-size: 0.9rem; padding: 10px 18px; }
  }
</style>
</head>
<body>
  <!-- FIXED LOGO -->
  <img src="J-removebg-preview.png" alt="Jordan Lewis Logo" class="logo-fixed">

  <!-- HEADER -->
  <header>
    <h1>Welcome to My Portfolio</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="personalProjects.html">Projects</a></li>
        <li><a href="services.html">My Services</a></li>
        <li><a href="contact.html">Contact Me</a></li>
      </ul>
    </nav>
  </header>

  <!-- HERO SECTION -->
  <section class="hero" id="home">
    <h1>Hello, I'm Jordan</h1>
    <p id="typewriter"></p>
    <a href="personalProjects.html">View Projects</a>
    <a href="about.html">About Me</a>

    <!-- Shapes -->
    <div class="shape" style="width:100px;height:100px;background:linear-gradient(to right, #0d1b4c, #6a1b9a); top:10%; left:15%; animation-duration:20s;"></div>
    <div class="shape" style="width:60px;height:60px;background:linear-gradient(to right, #6a1b9a, #0d1b4c); top:30%; left:70%; animation-duration:25s;"></div>
    <div class="shape" style="width:80px;height:80px;background:linear-gradient(to right, #0d1b4c, #6a1b9a); top:60%; left:40%; animation-duration:22s;"></div>
    <div class="shape" style="width:50px;height:50px;background:linear-gradient(to right, #6a1b9a, #0d1b4c); top:80%; left:20%; animation-duration:28s;"></div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 Jordan Lewis</p>
  </footer>

  <!-- TYPEWRITER SCRIPT -->
  <script>
    const texts = [
      "I build cool web projects!",
      "I love creating interactive websites!",
      "Check out my portfolio to see my work!"
    ];
    const typewriterElement = document.getElementById("typewriter");
    let textIndex = 0;
    let charIndex = 0;

    function typeWriter() {
      if (charIndex < texts[textIndex].length) {
        typewriterElement.textContent += texts[textIndex].charAt(charIndex);
        charIndex++;
        setTimeout(typeWriter, 90);
      } else {
        setTimeout(() => {
          typewriterElement.textContent = "";
          charIndex = 0;
          textIndex = (textIndex + 1) % texts.length;
          typeWriter();
        }, 1500);
      }
    }

    window.onload = typeWriter;
  </script>
</body>
</html>
