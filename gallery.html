<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gallery</title>

<style>
  :root {
    --primary: #0d1b4c;
    --secondary: #6a1b9a;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #f4f4f9;
    color: #000;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
  }

  /* --- FIXED LOGO --- */
  #true-fixed-logo {
    position: fixed;
    top: env(safe-area-inset-top, 10px);
    left: 12px;
    width: 80px;
    z-index: 9999;
  }

  #true-fixed-logo img {
    width: 100%;
    height: auto;
  }

  /* --- HEADER --- */
  header {
    background: linear-gradient(to right, var(--primary), var(--secondary));
    color: #fff;
    padding: 90px 20px 25px;
    position: relative;
  }

  header h1 {
    margin: 0;
    font-size: 1.6rem;
  }

  /* --- NAV --- */
  nav {
    margin-top: 15px;
  }

  .menu-toggle {
    display: none;
    font-size: 1.8rem;
    cursor: pointer;
  }

  nav ul {
    list-style: none;
    padding: 0;
    margin: 15px 0 0;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
  }

  nav ul li {
    margin: 8px 12px;
  }

  nav ul li a {
    color: #fff;
    text-decoration: none;
    font-weight: bold;
  }

  /* --- SECTION --- */
  section {
    padding: 30px 16px;
  }

  h2 {
    color: #4169E1;
  }

  /* --- CAROUSEL --- */
  .carousel-container {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding: 20px 8px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }

  .carousel-container::-webkit-scrollbar {
    display: none;
  }

  .carousel-item {
    flex: 0 0 auto;
    min-width: 220px;
    scroll-snap-align: center;
  }

  .carousel-item img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 12px;
  }

  /* --- LIGHTBOX --- */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 100000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .lightbox.show {
    display: flex;
  }

  .lightbox img {
    max-width: 92%;
    max-height: 75%;
    border-radius: 12px;
  }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 3rem;
    color: white;
    padding: 12px;
    cursor: pointer;
    user-select: none;
  }

  .arrow.left { left: 10px; }
  .arrow.right { right: 10px; }

  /* --- FOOTER --- */
  footer {
    background: linear-gradient(to right, var(--primary), var(--secondary));
    color: #fff;
    padding: 18px;
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 768px) {

    .menu-toggle {
      display: block;
    }

    nav ul {
      display: none;
      flex-direction: column;
      margin-top: 10px;
    }

    nav ul.show {
      display: flex;
    }

    nav ul li {
      margin: 12px 0;
    }

    header {
      padding-top: 100px;
    }

    .carousel-item {
      min-width: 180px;
    }

    .carousel-item img {
      height: 140px;
    }

    .arrow {
      font-size: 2.4rem;
    }
  }
</style>
</head>

<body>

<div id="true-fixed-logo">
  <img src="img/J-removebg-preview.png" alt="Jordan Lewis Logo">
</div>

<header>
  <h1>Gallery</h1>

  <nav>
    <div class="menu-toggle" id="menuToggle">☰</div>
    <ul id="menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Me</a></li>
      <li><a href="personalProjects.html">Personal Projects</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="podcast.html">Podcast</a></li>
      <li><a href="contact.html">Contact Me</a></li>
    </ul>
  </nav>
</header>

<section>
  <h2>My Photography Work</h2>
  <p>Swipe through my projects</p>

  <div class="carousel-container">
    <div class="carousel-item"><img src="img/flowers_b&w.JPG"></div>
    <div class="carousel-item"><img src="img/flowers.JPG"></div>
    <div class="carousel-item"><img src="img/leaves.JPG"></div>
    <div class="carousel-item"><img src="img/nature.JPG"></div>
    <div class="carousel-item"><img src="img/rocks.JPG"></div>
    <div class="carousel-item"><img src="img/trees.JPG"></div>
    <div class="carousel-item"><img src="img/shadowheart(1).JPG"></div>
    <div class="carousel-item"><img src="img/shadowheart.JPG"></div>
    <div class="carousel-item"><img src="img/shadowlooking.JPG"></div>
    <div class="carousel-item"><img src="img/shadowme.JPG"></div>
    <div class="carousel-item"><img src="img/gingerbread.JPG"></div>
    <div class="carousel-item"><img src="img/eclipise.JPG"></div>
    <div class="carousel-item"><img src="img/Shallow Depth19.JPG"></div>
  </div>
</section>

<div class="lightbox" id="lightbox">
  <span class="arrow left" id="prev">&#10094;</span>
  <img src="">
  <span class="arrow right" id="next">&#10095;</span>
</div>

<footer>
  <p>&copy; 2025 Jordan Lewis</p>
</footer>

<script>
  const menuToggle = document.getElementById('menuToggle');
  const menu = document.getElementById('menu');

  menuToggle.onclick = () => menu.classList.toggle('show');

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = lightbox.querySelector('img');
  const images = [...document.querySelectorAll('.carousel-item img')];
  let index = 0;

  images.forEach((img, i) => {
    img.onclick = () => {
      index = i;
      lightboxImg.src = img.src;
      lightbox.classList.add('show');
    };
  });

  document.getElementById('prev').onclick = e => {
    e.stopPropagation();
    index = (index - 1 + images.length) % images.length;
    lightboxImg.src = images[index].src;
  };

  document.getElementById('next').onclick = e => {
    e.stopPropagation();
    index = (index + 1) % images.length;
    lightboxImg.src = images[index].src;
  };

  lightbox.onclick = () => lightbox.classList.remove('show');

  /* swipe support */
  let startX = 0;
  lightbox.addEventListener('touchstart', e => startX = e.touches[0].clientX);
  lightbox.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    if (dx > 50) document.getElementById('prev').click();
    if (dx < -50) document.getElementById('next').click();
  });
</script>

</body>
</html>
