<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gallery</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #f4f4f9;
    color: #000;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
  }

  /* --- FIXED LOGO --- */
  #true-fixed-logo {
    position: fixed; /* stays in viewport */
    top: 15px;
    left: 15px;
    width: 100px;
    z-index: 9999;
  }

  #true-fixed-logo img {
    width: 100%;
    height: auto;
    display: block;
  }

  header {
    background: linear-gradient(to right, #0d1b4c, #6a1b9a);
    color: #fff;
    padding: 20px 20px 25px 20px;
    position: relative;
    z-index: 1; /* ensures logo stays above */
  }

  header h1 {
    margin: 0;
    font-size: 2rem;
  }

  nav ul {
    list-style: none;
    margin: 15px 0 0 0;
    padding: 0;
  }

  nav ul li {
    display: inline-block;
    margin: 0 15px;
  }

  nav ul li a {
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.3s;
  }

  nav ul li a:hover {
    text-decoration: underline;
  }

  section {
    padding: 40px 20px;
  }

  h2 {
    color: #4169E1;
    margin-bottom: 20px;
  }

  p {
    margin-bottom: 30px;
  }

  /* --- Carousel --- */
  .carousel-container {
    display: flex;
    overflow-x: auto;
    scroll-behavior: smooth;
    padding: 20px 0;
    gap: 20px;
    scrollbar-width: none;
  }

  .carousel-container::-webkit-scrollbar {
    display: none;
  }

  .carousel-item {
    min-width: 250px;
    flex: 0 0 auto;
    transition: transform 0.3s ease;
    cursor: pointer;
  }

  .carousel-item:hover {
    transform: scale(1.05);
  }

  .carousel-item img {
    width: 100%;
    height: auto;
    max-height: 200px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
  }

  .carousel-item h3,
  .carousel-item p {
    display: none !important;
  }

  footer {
    background: linear-gradient(to right, #0d1b4c, #6a1b9a);
    color: #fff;
    padding: 20px;
    margin-top: 40px;
  }

  /* --- LIGHTBOX --- */
  .lightbox {
    display: none;
    position: fixed;
    z-index: 1000000;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  .lightbox img {
    max-width: 90%;
    max-height: 85%;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
  }

  .lightbox.show {
    display: flex;
    animation: fadeIn 0.3s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* --- Arrows --- */
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 3rem;
    color: white;
    cursor: pointer;
    user-select: none;
    padding: 10px 20px;
    transition: opacity 0.3s;
  }

  .arrow:hover {
    opacity: 0.7;
  }

  .arrow.left {
    left: 30px;
  }

  .arrow.right {
    right: 30px;
  }

  /* --- MOBILE --- */
  @media (max-width: 768px) {
    header {
      padding: 100px 15px 25px 15px;
    }

    header h1 {
      font-size: 1.5rem;
    }

    nav ul li {
      display: block;
      margin: 10px 0;
    }

    .carousel-item {
      min-width: 200px;
    }

    .carousel-item img {
      max-height: 160px;
    }

    #true-fixed-logo {
      width: 80px;
      top: 10px;
      left: 10px;
    }

    .arrow {
      font-size: 2.5rem;
      padding: 8px 12px;
    }
  }

  @media (max-width: 480px) {
    .carousel-item {
      min-width: 170px;
    }

    .carousel-item img {
      max-height: 140px;
    }

    header {
      padding-top: 90px;
    }
  }
</style>
</head>
<body>

<!-- FIXED LOGO -->
<div id="true-fixed-logo">
  <img src="img/J-removebg-preview.png" alt="Jordan Lewis Logo" />
</div>

<header>
  <h1>Gallery</h1>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Me</a></li>
      <li><a href="personalProjects.html">Personal Projects</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="podcast.html">Podcast</a></li>
      <li><a href="contact.html">Contact Me</a></li>
    </ul>
  </nav>
</header>

<section>
  <h2>My Photography Work</h2>
  <p>Scroll through my projects below!</p>

  <div class="carousel-container">
    <div class="carousel-item"><img src="img/flowers_b&w.JPG" alt="Nature"></div>
    <div class="carousel-item"><img src="img/flowers.JPG" alt="Events"></div>
    <div class="carousel-item"><img src="img/leaves.JPG" alt="Nature"></div>
    <div class="carousel-item"><img src="img/nature.JPG" alt="Urban"></div>
    <div class="carousel-item"><img src="img/rocks.JPG" alt="Food"></div>
    <div class="carousel-item"><img src="img/trees.JPG" alt="Travel"></div>
    <div class="carousel-item"><img src="img/shadowheart(1).JPG" alt="Abstract"></div>
    <div class="carousel-item"><img src="img/shadowheart.JPG" alt="Pets"></div>
    <div class="carousel-item"><img src="img/shadowlooking.JPG" alt="Architecture"></div>
    <div class="carousel-item"><img src="img/shadowme.JPG" alt="Fashion"></div>
    <div class="carousel-item"><img src="img/gingerbread.JPG" alt="Abstract"></div>
    <div class="carousel-item"><img src="img/eclipise.JPG" alt="Abstract"></div>
    <div class="carousel-item"><img src="img/Shallow Depth19.JPG" alt="Abstract"></div>
  </div>
</section>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="arrow left" id="prev">&#10094;</span>
  <img src="" alt="Enlarged Photo">
  <span class="arrow right" id="next">&#10095;</span>
</div>

<footer>
  <p>&copy; 2025 Jordan Lewis</p>
</footer>

<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = lightbox.querySelector('img');
  const images = Array.from(document.querySelectorAll('.carousel-item img'));
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');

  let currentIndex = 0;

  images.forEach((img, index) => {
    img.addEventListener('click', () => {
      currentIndex = index;
      showImage();
      lightbox.classList.add('show');
    });
  });

  function showImage() {
    lightboxImg.src = images[currentIndex].src;
  }

  prev.addEventListener('click', (e) => {
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    showImage();
  });

  next.addEventListener('click', (e) => {
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % images.length;
    showImage();
  });

  lightbox.addEventListener('click', () => {
    lightbox.classList.remove('show');
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('show')) return;
    if (e.key === 'ArrowRight') next.click();
    if (e.key === 'ArrowLeft') prev.click();
    if (e.key === 'Escape') lightbox.classList.remove('show');
  });
</script>

</body>
</html>
